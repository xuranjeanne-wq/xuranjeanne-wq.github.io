<head>
    <meta charset="UTF-8">

    <title>Creator Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital@0;1&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            color: #121212;
            padding: 60px 80px;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 140px;
        }
        .logo { font-weight: 600; font-size: 18px; letter-spacing: 1.5px; }
        nav a {
            margin-left: 36px;
            text-decoration: none;
            color: #121212;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        nav a:hover { color: #D4AF37; }
        .hero { max-width: 750px; margin-bottom: 120px; }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 52px;
            font-weight: 400;
            line-height: 1.15;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .hero p { font-size: 18px; color: #666; margin-bottom: 44px; }
        .projects { display: flex; gap: 32px; }
        .card {
            flex: 1;
            background: #F0F0F0;
            height: 320px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 24px;
            text-decoration: none;
            color: #121212;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            background-color: #E6E6E6;
        }
        .card h3 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 400; margin-bottom: 8px; }
        .card p { font-size: 12px; color: #555; }
        footer { margin-top: 120px; display: flex; justify-content: space-between; font-size: 13px; color: #777; }
        footer a { color: #121212; text-decoration: none; }
        footer a:hover { color: #D4AF37; }
    </style>
</head>

        <p>专注于视觉艺术、品牌策略与空间交互的跨界创作者。</p>

    <section class="projects">
        <a href="project-01.html" class="card">
